name: 02 - Manual

on:
  workflow_dispatch:
    inputs:
      log_level:
        description: "Nivel de log"
        required: true
        default: "info"
        type: choice
        options:
          - info
          - debug
          - warn
          - error

jobs:
  hello:
    runs-on: ubuntu-24.04

    steps:
      - name: Saludar
        run: echo "Hola desde GitHub Actions!"

      - name: Ver fecha del runner
        run: date

      - name: Ver archivos disponibles
        run: ls -la