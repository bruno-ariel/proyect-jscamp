name: 04 - Events

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

jobs:
  inspect-event:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    
    steps:
      - name: Inspect event
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Issue: ${{ github.event.issue.number }}"
          echo "Comment: ${{ github.event.comment.body}}"

      - name: Comentar como bot en GitHub Actions
        if: github.event_name == 'issues' && github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --body "Gracias por abrir este issue. Nos pondremos en contacto contigo."

      - name: Comentar como autor del repo
        if: github.event_name == 'issues' && github.event.action == 'opened'
        env:
          AUTHOR_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN}}
          ISSUE_NUMBER: ${{ github.event.issue.number}}
        run: |
          if [[ -z "$AUTHOR_TOKEN" ]]; then
            echo "::warning::No hay PERSONAL_ACCESS_TOKEN configurado. Se omite comentario como autor."
            exit 0
          fi
          GH_TOKEN="$AUTHOR_TOKEN" gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY"
            --body "Hola , soy el dueño del repositorio respondiendo personalmente. Mirate la guia de constribucion mientras"
